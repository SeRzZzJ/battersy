[package]
name = "battersy"
version = "1.3.3"
edition = "2024"
authors = ["SeRzZzJ <serzzzj.dev@gmail.com>"]
description = "A lightweight, zero-dependency Linux terminal utility that parses battery status."
repository = "https://github.com/SeRzZzJ/battersy"
readme = "README.md"
license = "MIT"
keywords = ["battery", "cli", "linux", "status", "terminal"]
categories = ["command-line-utilities", "os::linux-apis"]
publish = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[dependencies]
